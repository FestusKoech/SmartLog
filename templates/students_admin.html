{% extends "layout.html" %}
{% block title %}Students{% endblock %}
{% block content %}
<h1>Students</h1>

<div class="card mb-3">
  <div class="card-body">
    <h5>Register Student</h5>
    <form method="post" action="{{ url_for('staff_register_student') }}" class="row g-2">
      <div class="col-md-3">
        <input class="form-control" name="studentID" placeholder="Student ID" required>
      </div>
      <div class="col-md-4">
        <input class="form-control" name="name" placeholder="Full name" required>
      </div>
      <div class="col-md-3">
        <input class="form-control" name="phone" placeholder="Phone">
      </div>
      <div class="col-md-2">
        <button class="btn btn-primary w-100" type="submit">Register</button>
      </div>
    </form>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <h5>Existing Students</h5>
    <div class="table-responsive">
      <table class="table table-sm table-hover align-middle custom-table" id="studentsTable">
        <thead>
          <tr><th>StudentID</th><th>Name</th><th>Phone</th><th>Action</th></tr>
        </thead>
        <tbody>
          {% for s in students %}
          <tr data-id="{{ s.id }}" data-studentid="{{ s.studentID }}" data-name="{{ s.name }}" data-phone="{{ s.phone }}">
            <td>{{ s.studentID }}</td>
            <td>{{ s.name }}</td>
            <td>{{ s.phone }}</td>
            <td>
              <button type="button" class="btn btn-outline-primary btn-sm view-edit-btn">View / Edit</button>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Student Edit Modal -->
<div class="modal fade" id="studentEditModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <form method="post" action="{{ url_for('edit_student') }}">
        <div class="modal-header">
          <h5 class="modal-title">Edit Student</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="id" id="student_id">
          <div class="mb-2">
            <label class="form-label">Student ID</label>
            <input type="text" name="studentID" id="student_studentID" class="form-control" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" id="student_name" class="form-control" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" id="student_phone" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const modal = new bootstrap.Modal(document.getElementById('studentEditModal'));
  const idInput = document.getElementById('student_id');
  const sidInput = document.getElementById('student_studentID');
  const nameInput = document.getElementById('student_name');
  const phoneInput = document.getElementById('student_phone');

  document.querySelectorAll('.view-edit-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const tr = this.closest('tr');
      idInput.value = tr.dataset.id || '';
      sidInput.value = tr.dataset.studentid || '';
      nameInput.value = tr.dataset.name || '';
      phoneInput.value = tr.dataset.phone || '';
      modal.show();
    });
  });
});
</script>
{% endblock %}
