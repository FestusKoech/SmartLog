{% extends "layout.html" %}
{% block title %}Reports{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="fw-bold text-secondary">System Logs</h4>
  <a href="{{ url_for('export_logs') }}" class="btn btn-outline-primary btn-sm shadow-sm">
    <i class="bi bi-download"></i> Export CSV
  </a>
</div>

<div class="card">
  <div class="card-body">
    <div class="table-responsive">
      
      <table class="table table-sm custom-table">
        <thead><tr><th>ts</th><th>device_id</th><th>action</th><th>meta</th></tr></thead>
        <tbody>
          {% for l in logs %}
            <tr><td>{{ l.ts }}</td><td>{{ l.device_id }}</td><td>{{ l.action }}</td><td>{{ l.meta }}</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
